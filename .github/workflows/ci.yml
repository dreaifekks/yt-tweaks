name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['README.md']
  pull_request:
    branches: [master]
    paths-ignore: ['README.md']

permissions:
  contents: read

# Only the build. The tests run on the machine the change is made on.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: npm run build
